name: Release

on:
  push:
    branches:
      - main
    paths:
      - "crates/weave-core/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version
        id: detect
        run: |
          VERSION=$(grep '^version' crates/weave-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$VERSION detected"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  create-tag:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create and push tag
        run: |
          git tag "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

  build:
    needs: [check-version, create-tag]
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            cross_package: gcc-aarch64-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross_package != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_package }}

      - name: Configure cargo for cross-compilation
        if: matrix.cross_linker != ''
        run: |
          mkdir -p ~/.cargo
          echo "[target.${{ matrix.target }}]" >> ~/.cargo/config.toml
          echo "linker = \"${{ matrix.cross_linker }}\"" >> ~/.cargo/config.toml

      - name: Build weave-mcp
        run: cargo build --release --target ${{ matrix.target }} --bin weave-mcp ${{ matrix.cross && '--features vendored-openssl' || '' }}

      - name: Build weave-cli
        run: cargo build --release --target ${{ matrix.target }} --bin weave ${{ matrix.cross && '--features vendored-openssl' || '' }}

      - name: Build weave-driver
        run: cargo build --release --target ${{ matrix.target }} --bin weave-driver ${{ matrix.cross && '--features vendored-openssl' || '' }}

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          tar czf ../../../dist/weave-cli-${{ matrix.target }}.tar.gz weave
          tar czf ../../../dist/weave-driver-${{ matrix.target }}.tar.gz weave-driver
          tar czf ../../../dist/weave-mcp-${{ matrix.target }}.tar.gz weave-mcp

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path target/${{ matrix.target }}/release/weave.exe -DestinationPath dist/weave-cli-${{ matrix.target }}.zip
          Compress-Archive -Path target/${{ matrix.target }}/release/weave-driver.exe -DestinationPath dist/weave-driver-${{ matrix.target }}.zip
          Compress-Archive -Path target/${{ matrix.target }}/release/weave-mcp.exe -DestinationPath dist/weave-mcp-${{ matrix.target }}.zip
          tar -czf dist/weave-cli-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release weave.exe
          tar -czf dist/weave-driver-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release weave-driver.exe
          tar -czf dist/weave-mcp-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release weave-mcp.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          files: |
            *.tar.gz
            *.zip
            checksums.txt
          generate_release_notes: true

  publish-npm:
    needs: [check-version, release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Sync npm package version
        run: node ./scripts/sync-package-version.mjs "${{ needs.check-version.outputs.version }}"

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Publish npm package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crates:
    needs: [check-version, create-tag]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish weave-core
        run: cargo publish -p weave-core --no-verify || echo "weave-core already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish weave-crdt
        run: cargo publish -p weave-crdt --no-verify || echo "weave-crdt already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish weave-cli
        run: cargo publish -p weave-cli --no-verify || echo "weave-cli already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish weave-driver
        run: cargo publish -p weave-driver --no-verify || echo "weave-driver already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish weave-mcp
        run: cargo publish -p weave-mcp --no-verify || echo "weave-mcp already published, skipping"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
