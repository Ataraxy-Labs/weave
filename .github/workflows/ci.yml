name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check out YAML fixtures
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: yaml/yaml-test-suite
          ref: 6e6c296ae9c9d2d5c4134b4b64d01b29ac19ff6f # data-2022-01-17
          path: .local/yaml-test-suite
          persist-credentials: false
      - name: Check YAML parsing and merge values
        if: runner.os == 'Linux'
        env:
          YAML_TEST_SUITE: ${{ github.workspace }}/.local/yaml-test-suite
        shell: bash
        run: |
          cargo test --quiet --locked -p weave-core --lib \
            dataunion::yaml_suite::upstream_yaml_fixtures -- --ignored --exact | tee "$RUNNER_TEMP/yaml-fixtures.log"
          grep -qx 'running 1 test' "$RUNNER_TEMP/yaml-fixtures.log"

      - name: Git identity for tests that commit
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The in-tree behaviour suite, named explicitly. `cargo test --workspace`
      # above already runs it, but only implicitly: if these files were ever
      # moved or renamed, that step would keep passing while testing nothing of
      # the merge's actual behaviour. Naming the targets makes that a hard
      # failure instead of a silent one.
      - name: In-tree behaviour suite (must exist, must run)
        run: |
          cargo test -p weave-core --test public_properties
          cargo test -p weave-driver --test public_properties
