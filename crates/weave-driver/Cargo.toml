[package]
name = "weave-driver"
version = "0.3.6"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Git merge driver for entity-level semantic merging. Drop-in replacement for git's default merge strategy."
repository = "https://github.com/Ataraxy-Labs/weave"
homepage = "https://github.com/Ataraxy-Labs/weave"
keywords = ["merge", "git", "merge-driver", "semantic"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[dependencies]
weave-core = { path = "../weave-core", version = "0.3.6" }
sem-core = "0.7.0"
weave-crdt = { path = "../weave-crdt", version = "0.3.6", optional = true }
serde_json = "1"
env_logger = "0.11"
log = "0.4"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
crdt = ["weave-crdt"]
