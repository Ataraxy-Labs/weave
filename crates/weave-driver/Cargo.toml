[package]
name = "weave-driver"
version = "0.5.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Git merge driver for entity-level semantic merging. Drop-in replacement for git's default merge strategy."
repository = "https://github.com/Ataraxy-Labs/weave"
homepage = "https://github.com/Ataraxy-Labs/weave"
keywords = ["merge", "git", "merge-driver", "semantic"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[dependencies]
weave-core = { path = "../weave-core", version = "0.5.1" }
sem-core = "0.21.1"
weave-crdt = { path = "../weave-crdt", version = "0.5.1", optional = true }
serde_json = "1"
thiserror = "2"
# Installs the global logger so that RUST_LOG surfaces what the dependency
# tree logs through the `log` facade (git2, notably). weave-driver itself logs
# nothing, so it takes no direct dependency on `log`.
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
crdt = ["weave-crdt"]
