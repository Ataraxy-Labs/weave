[package]
name = "weave-github"
version = "0.5.4"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "GitHub webhook handler for entity-level semantic merges"
repository = "https://github.com/ataraxy-labs/weave"
publish = false

[[bin]]
name = "weave-github"
path = "src/main.rs"

[dependencies]
weave-core = { version = "0.5.4", path = "../weave-core" }
sem-core = { version = "0.23", default-features = false, features = ["git", "parallel", "grammar-all", "mmap"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jsonwebtoken = "11"
reqwest = { version = "0.13", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
