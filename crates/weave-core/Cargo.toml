[package]
name = "weave-core"
version = "0.5.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Entity-level semantic merge engine. Three-way merge at the function/class/method level instead of lines."
repository = "https://github.com/Ataraxy-Labs/weave"
homepage = "https://github.com/Ataraxy-Labs/weave"
keywords = ["merge", "semantic", "git", "tree-sitter", "conflict-resolution"]
categories = ["development-tools", "algorithms"]
readme = "../../README.md"

[dependencies]
sem-core = { version = "0.23", default-features = false, features = ["git", "parallel", "grammar-all", "mmap"] }
diffy = "0.5"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Law witnesses (tests/laws_merge.rs): property-based testing over arbitrary
# synthetic modules. Dev-only; does not touch the shipped library.
proptest = "1"

[[bench]]
name = "merge_bench"
harness = false
