[package]
name = "weave-mcp"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MCP server for entity-level semantic merge: read merge findings and cross-file binding risk, and coordinate live multi-agent edits via a shared CRDT. 22 tools."
repository = "https://github.com/Ataraxy-Labs/weave"
homepage = "https://github.com/Ataraxy-Labs/weave"
keywords = ["mcp", "merge", "semantic", "agent", "coordination"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[[bin]]
name = "weave-mcp"
path = "src/main.rs"

[dependencies]
weave-core = { path = "../weave-core", version = "0.5.0" }
weave-crdt = { path = "../weave-crdt", version = "0.5.0" }
weave-cli = { path = "../weave-cli", version = "0.5.0", default-features = false }
sem-core = "0.21.0"
lru = "0.18"
rmcp = { version = "1.7", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
openssl = { version = "0.10", features = ["vendored"], optional = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
default = []
# Not used in any `use` statement — the point is the link, not the API.
# `--features vendored-openssl` is what the cross-compile jobs in
# .github/workflows pass so openssl is built from source rather than
# found on the runner. cargo-machete cannot see that, hence the ignore.
vendored-openssl = ["openssl"]

[package.metadata.cargo-machete]
ignored = ["openssl"]
