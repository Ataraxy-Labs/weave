[package]
name = "weave-cli"
version = "0.5.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Entity-level semantic merge CLI. Resolves conflicts at the function/class level instead of lines."
repository = "https://github.com/Ataraxy-Labs/weave"
homepage = "https://github.com/Ataraxy-Labs/weave"
keywords = ["merge", "semantic", "git", "cli", "conflict-resolution"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[lib]
name = "weave_cli"
path = "src/lib.rs"

[[bin]]
name = "weave"
path = "src/main.rs"

[dependencies]
weave-core = { path = "../weave-core", version = "0.5.1" }
weave-crdt = { path = "../weave-crdt", version = "0.5.1" }
sem-core = "0.21.1"
clap = { version = "4", features = ["derive"] }
colored = "3"
diffy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
openssl = { version = "0.10", features = ["vendored"], optional = true }


[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
default = []
# Not used in any `use` statement — the point is the link, not the API.
# `--features vendored-openssl` is what the cross-compile jobs in
# .github/workflows pass so openssl is built from source rather than
# found on the runner. cargo-machete cannot see that, hence the ignore.
vendored-openssl = ["openssl"]

[package.metadata.cargo-machete]
ignored = ["openssl"]
